<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DSH Remote Gateway</title>
  <desc id="desc">A desktop running DeepSeek Harness connects securely to a mobile browser through an authenticated encrypted tunnel.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="60" x2="1480" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171B26"/>

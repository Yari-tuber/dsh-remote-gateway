      <stop offset="1" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="beam" x1="460" y1="520" x2="1165" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>

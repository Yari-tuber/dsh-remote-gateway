name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
